# CI: Rust (fmt, clippy, nextest, cargo-deny, cargo-shear), typos, and UI
# (tsc, oxlint, prettier, knip, vitest). Same gates as `bun run check`.
#
# Every pull request and every push to main runs on all six targets: Linux,
# macOS and Windows, each on x86_64 and arm64 (Actions minutes are free for
# public repositories).
#
# Actions are pinned by commit SHA (version in the comment), as in bunmail.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  HUSKY: "0"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
          - windows-2025
          - windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Retries against slow Ubuntu mirrors; shared with installers.yml.
      - name: Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        # A path to this repo's own action, as GitHub has long supported; the newer `$/` form is not needed.
        uses: ./.github/actions/linux-deps # zizmor: ignore[self-repository]

      # Installs rustup if the image lacks it; rust-toolchain.toml then selects 1.100.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: "1.100"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-nextest,cargo-deny,cargo-shear

      # Tauri embeds the built UI at compile time; an empty folder is enough for checks.
      - name: Placeholder UI build output
        shell: bash
        run: mkdir -p ui/dist

      - name: Format
        run: cargo fmt --all -- --check

      # Twice: the build that ships (default features) and everything (all features).
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # ts-rs only writes files, never deletes them: start from an empty folder so a
      # binding the tests no longer produce shows up as deleted in the check below.
      - name: Clear generated TypeScript bindings
        if: matrix.os == 'ubuntu-24.04'
        run: rm -rf ui/src/lib/bindings

      - name: Tests
        run: cargo nextest run --workspace --all-features --profile ci --locked

      # nextest does not run tests inside /// doc comments.
      - name: Doc tests
        run: cargo test --doc --workspace --all-features --locked

      # Platform-independent checks: run once.
      - name: Licenses and advisories (cargo-deny)
        if: matrix.os == 'ubuntu-24.04'
        run: cargo deny check

      - name: Unused dependencies (cargo-shear)
        if: matrix.os == 'ubuntu-24.04'
        run: cargo shear

      # The tests rewrite ui/src/lib/bindings (ts-rs, #16): it must match what is committed.
      - name: TypeScript bindings up to date
        if: matrix.os == 'ubuntu-24.04'
        run: |
          if [ -n "$(git status --porcelain -- ui/src/lib/bindings)" ]; then
            git status --short -- ui/src/lib/bindings
            git diff -- ui/src/lib/bindings
            echo "::error::ui/src/lib/bindings is out of date: run 'bun run test:rust' and commit the result."
            exit 1
          fi

  typos:
    name: Spelling (typos)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2

  ui:
    name: UI (tsc, oxlint, prettier, knip, vitest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      - name: Dead code (knip)
        run: bun run knip

      - name: Tests
        run: bun run test
