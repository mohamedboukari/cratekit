[package]
name = "cratekit"
description = "Cratekit desktop app: thin Tauri glue (commands, events, MIDI, wiring)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# The app logic lives in a library so `main.rs` stays a one-liner.
name = "cratekit_lib"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
anyhow = { workspace = true }
cratekit-audio = { workspace = true }
cratekit-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
ts-rs = { workspace = true, optional = true }

[features]
# TypeScript bindings of the IPC payloads, written to ui/src/lib/bindings by the tests (#16).
ts = ["dep:ts-rs", "cratekit-core/ts"]

[lints]
workspace = true
