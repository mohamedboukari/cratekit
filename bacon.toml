# bacon: background checker (https://dystroy.org/bacon). Run `bacon` in a
# terminal pane; it re-runs the job on every save. Press c / l / t to switch.
default_job = "clippy"

[jobs.check]
command = ["cargo", "check", "--workspace", "--all-targets"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
need_stdout = false

[jobs.nextest]
command = [
  "cargo",
  "nextest",
  "run",
  "--workspace",
  "--hide-progress-bar",
  "--failure-output",
  "final",
]
need_stdout = true
analyzer = "nextest"

[keybindings]
c = "job:check"
l = "job:clippy"
t = "job:nextest"
