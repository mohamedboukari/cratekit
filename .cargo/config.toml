# Settings for ts-rs, which writes the TypeScript types of the IPC payloads
# when the tests run with the `ts` feature (#16).
[env]
TS_RS_EXPORT_DIR = { value = "ui/src/lib/bindings", relative = true }
# Ids are i64 in Rust but JSON numbers on the wire: type them as `number`, not `bigint`.
TS_RS_LARGE_INT = "number"
