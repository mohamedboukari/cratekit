# cargo-nextest configuration. Local runs use `default`; CI runs `--profile ci`.

[profile.default]
# Show the output of failing tests only.
failure-output = "immediate-final"
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
# Run every test even after a failure, so CI reports all of them at once.
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"
