[package]
name = "cratekit-core"
description = "Cratekit core: decode, analysis, mastering, stems, library and export. Pure Rust, no Tauri."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ebur128 = { workspace = true }
ort = { workspace = true }
ring = { workspace = true }
rubato = { workspace = true }
rusqlite = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
stratum-dsp = { workspace = true, optional = true }
symphonia = { workspace = true }
thiserror = { workspace = true }
ureq = { workspace = true }
ts-rs = { workspace = true, optional = true }

[features]
# Synthetic test audio (`synth` module) for other crates' tests; never in release builds.
test-helpers = []
# The stratum-dsp detectors (`analysis::stratum`); off by default, our own detectors are the default.
stratum = ["dep:stratum-dsp"]
# TypeScript bindings of the IPC payloads, written to ui/src/lib/bindings by the tests (#16).
ts = ["dep:ts-rs"]

[lints]
workspace = true
