[package]
name = "cratekit-core"
description = "Cratekit core: decode, analysis, mastering, stems, library and export. Pure Rust, no Tauri."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ebur128 = { workspace = true }
stratum-dsp = { workspace = true, optional = true }
thiserror = { workspace = true }

[features]
# Synthetic test audio (`synth` module) for other crates' tests; never in release builds.
test-helpers = []
# The stratum-dsp detectors (`analysis::stratum`); off by default, our own detectors are the default.
stratum = ["dep:stratum-dsp"]

[lints]
workspace = true
