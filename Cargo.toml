[workspace]
members = ["crates/cratekit-core", "crates/cratekit-audio", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/mohamedboukari/cratekit"
publish = false

# Shared dependency versions. Crates use `name = { workspace = true }`.
# Every new entry needs a license check first (see CONTRIBUTING.md, Hard rules).
[workspace.dependencies]
anyhow = "1"
cratekit-audio = { path = "crates/cratekit-audio" }
cratekit-core = { path = "crates/cratekit-core" }
# Audio output on every platform (Apache-2.0); the stack's choice (CLAUDE.md).
cpal = "0.18"
# EBU R128 / ITU-R BS.1770 loudness and true peak (MIT; deps MIT or Apache-2.0); approved 2026-11-18.
ebur128 = "0.1"
serde = { version = "1", features = ["derive"] }
# JSON: stored settings, and checks of the IPC payloads in tests (MIT OR Apache-2.0; already in the tree through Tauri).
serde_json = "1"
# BPM and key detection behind our detector traits (MIT OR Apache-2.0); approved 2026-11-15.
# No features: keeps `ml` (ONNX Runtime) out even if a later release enables it by default.
stratum-dsp = { version = "1", default-features = false }
tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }
# Native file and folder pickers (MIT OR Apache-2.0, Tauri team); approved 2026-11-15.
tauri-plugin-dialog = "2.8"
thiserror = "2"
# Lock-free single-producer single-consumer queues for the audio thread (MIT OR Apache-2.0); the stack's choice.
rtrb = "0.4"
# Resampling (MIT OR Apache-2.0; deps MIT or Apache-2.0); approved 2026-11-18.
rubato = "5"
# SQLite library database (MIT; deps MIT or Apache-2.0; SQLite itself is public domain).
# `bundled` compiles SQLite into the app, so there is nothing to install. Chosen in the stack (CLAUDE.md).
rusqlite = { version = "0.43", features = ["bundled"] }
# Audio decoding (MPL-2.0; deps MIT, Apache-2.0, BSD or Zlib); approved 2026-11-18.
# Default features (WAV, PCM, ADPCM, FLAC, Ogg Vorbis, MKV/WebM, ID3 and APE tags, SIMD with
# runtime detection) plus MP3, AAC and Apple Lossless (ALAC) in M4A, and AIFF. ALAC approved 2026-11-18.
symphonia = { version = "0.6", features = ["mp3", "aac", "alac", "isomp4", "aiff"] }

# Lints shared by every crate (each crate opts in with `[lints] workspace = true`).
# CI runs clippy with `-D warnings`, so "warn" also fails the build.
[workspace.lints.rust]
# No `unsafe` in our code. A module that truly needs it opts out with
# `#[expect(unsafe_code, reason = "...")]` and a `// SAFETY:` comment.
unsafe_code = "deny"

[workspace.lints.clippy]
# No panicking shortcuts in library code: return typed errors instead.
# Tests may use them (see clippy.toml); `main` opts out with a reason.
unwrap_used = "deny"
expect_used = "deny"
# No stray output: the app logs through a proper logger, never println!.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
# Silencing a lint must use `#[expect(lint, reason = "...")]`, never `#[allow]`.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
todo = "warn"
